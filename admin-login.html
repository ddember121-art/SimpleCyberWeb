<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Admin Login | CyBook</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="admin-login-page">
  <header class="site-header">
    <a class="brand" href="/" aria-label="CyBook home"><span class="brand-mark" aria-hidden="true">C</span> CyBook</a>
    <a class="back-link" href="/">Back to website</a>
  </header>
  <main class="admin-main page-width">
    <section class="quiz-panel admin-login-panel" aria-labelledby="admin-login-title">
      <p class="eyebrow">ADMINISTRATION</p>
      <h1 id="admin-login-title">Admin login</h1>
      <p class="admin-section-description">Sign in with the administrator account to view the private dashboard.</p>
      <form class="admin-login-form" id="admin-login-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" maxlength="128" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        <button class="button button-primary" type="submit">Sign in</button>
        <p class="admin-status" id="login-status" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer class="site-footer"><span>CyBook</span></footer>
  <script src="/admin.js" defer></script>
</body>
</html>
